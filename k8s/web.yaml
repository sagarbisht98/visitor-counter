apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: visitor-counter:1.0
          imagePullPolicy: IfNotPresent   # image is loaded into kind with `kind load docker-image`
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis
            - name: CLUSTER_NAME
              value: private-cluster      # override per cluster in the hybrid step
          resources:
            requests: {cpu: 100m, memory: 64Mi}   # HPA 50% is measured against this request
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
