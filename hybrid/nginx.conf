events {}
http {
  upstream visitor_app {
    server 127.0.0.1:8081 max_fails=1 fail_timeout=5s;        # private cluster (primary)
    server 127.0.0.1:8082 backup;                              # public cluster (failover)
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://visitor_app;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
